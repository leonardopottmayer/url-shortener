# Infra local do lab. Um nó de cada, sem HA. Portas escolhidas pra não colidir com
# outros projetos (ex.: pandora usa Postgres em 5433).
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Cria os dois bancos (database-per-service): shortening e kgs.
      - ./infra/postgres-init:/docker-entrypoint-initdb.d:ro

  mongo:
    image: mongo:7
    # Single-node replica set: o provider Mongo do tars usa sessão+transação, que
    # exige replica set (rs0). O serviço mongo-init roda o rs.initiate() uma vez.
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 20

  mongo-init:
    image: mongo:7
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"
    # Membro anunciado como localhost:27017 porque os serviços .NET rodam no host.
    entrypoint:
      - bash
      - -c
      - >
        mongosh --host mongo:27017 --quiet --eval '
          try { rs.status(); print("rs already initialized"); }
          catch (e) { rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "localhost:27017" }] }); }
        '

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  kafka:
    image: apache/kafka:3.8.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@localhost:9093"
      # Dual listener: host clients (.NET services) use PLAINTEXT localhost:9092;
      # in-network clients (kafka-init) use INTERNAL kafka:29092.
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093,INTERNAL://:29092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://localhost:9092,INTERNAL://kafka:29092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
    volumes:
      - kafkadata:/var/lib/kafka/data

  # Pre-creates the event topics so consumers don't fault on a not-yet-existing topic
  # (a consumer subscribing to a missing topic faults permanently instead of waiting).
  kafka-init:
    image: apache/kafka:3.8.0
    depends_on:
      - kafka
    restart: "no"
    entrypoint:
      - bash
      - -c
      - >
        for i in $$(seq 1 60); do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list >/dev/null 2>&1 && break; sleep 2;
        done;
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic urlshortener.url-accessed.v1 --partitions 1 --replication-factor 1;
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic urlshortener.url-created.v1 --partitions 1 --replication-factor 1;
        echo "topics ready"

  # --- Observability stack ---
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.109.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./infra/otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      # 4327 on the host (4317 is taken by another project's collector); services export here.
      # 8889 is reached by Prometheus over the compose network, so it needs no host mapping.
      - "4327:4317"   # OTLP gRPC

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"

volumes:
  pgdata:
  mongodata:
  kafkadata:
