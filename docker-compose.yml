# Infra local do lab. Um nó de cada, sem HA. Portas escolhidas pra não colidir com
# outros projetos (ex.: pandora usa Postgres em 5433).
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Cria os dois bancos (database-per-service): shortening e kgs.
      - ./infra/postgres-init:/docker-entrypoint-initdb.d:ro

  mongo:
    image: mongo:7
    # NOTA: o provider Mongo do tars usa sessão+transação, que exige replica set.
    # Quando a Fase 4 (Analytics) precisar de transação, subir como single-node
    # replica set (--replSet rs0 + rs.initiate()). Por ora, um nó standalone basta.
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  kafka:
    image: bitnami/kafka:3.7
    ports:
      - "9092:9092"
    environment:
      KAFKA_CFG_NODE_ID: "0"
      KAFKA_CFG_PROCESS_ROLES: "controller,broker"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "0@kafka:9093"
      KAFKA_CFG_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_CFG_ADVERTISED_LISTENERS: "PLAINTEXT://localhost:9092"
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    volumes:
      - kafkadata:/bitnami/kafka

volumes:
  pgdata:
  mongodata:
  kafkadata:
