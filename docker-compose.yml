# Infra local do lab + os serviços .NET e o frontend. Um nó de cada, sem HA.
# Portas escolhidas pra não colidir com outros projetos (ex.: pandora usa Postgres em 5433).
#
# "Rodar tudo de uma vez": docker compose up --build (é o que o botão de run do
# Visual Studio dispara via docker-compose.dcproj). Os serviços .NET falam com a
# infra pelos NOMES DE CONTAINER (postgres/mongo/redis/kafka/otel-collector) — os
# appsettings.json continuam apontando pra localhost pro modo host (F5 sem Docker),
# e aqui a rede é sobrescrita por variáveis de ambiente (Tars__... / ASPNETCORE).

# Base comum dos cinco serviços .NET: mesma imagem (uma build só), SERVICE escolhe qual roda.
x-dotnet-service: &dotnet-service
  image: urlshortener-services:local
  build:
    context: .
    dockerfile: Dockerfile
    secrets:
      - github_token
  restart: unless-stopped
  environment: &dotnet-env
    ASPNETCORE_ENVIRONMENT: Development
    Urls: "http://+:8080"
    Tars__Observability__OtlpEndpoint: "http://otel-collector:4317"

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Cria os dois bancos (database-per-service): shortening e kgs.
      - ./infra/postgres-init:/docker-entrypoint-initdb.d:ro

  mongo:
    image: mongo:7
    # Single-node replica set: o provider Mongo do tars usa sessão+transação, que
    # exige replica set (rs0). O serviço mongo-init roda o rs.initiate() uma vez.
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 20

  mongo-init:
    image: mongo:7
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"
    # Membro anunciado como localhost:27017 porque os serviços .NET rodam no host.
    entrypoint:
      - bash
      - -c
      - >
        mongosh --host mongo:27017 --quiet --eval '
          try { rs.status(); print("rs already initialized"); }
          catch (e) { rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "localhost:27017" }] }); }
        '

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  kafka:
    image: apache/kafka:3.8.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@localhost:9093"
      # Dual listener: host clients (.NET services) use PLAINTEXT localhost:9092;
      # in-network clients (kafka-init) use INTERNAL kafka:29092.
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093,INTERNAL://:29092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://localhost:9092,INTERNAL://kafka:29092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
    volumes:
      - kafkadata:/var/lib/kafka/data

  # Pre-creates the event topics so consumers don't fault on a not-yet-existing topic
  # (a consumer subscribing to a missing topic faults permanently instead of waiting).
  kafka-init:
    image: apache/kafka:3.8.0
    depends_on:
      - kafka
    restart: "no"
    entrypoint:
      - bash
      - -c
      - >
        for i in $$(seq 1 60); do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list >/dev/null 2>&1 && break; sleep 2;
        done;
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic urlshortener.url-accessed.v1 --partitions 1 --replication-factor 1;
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic urlshortener.url-created.v1 --partitions 1 --replication-factor 1;
        echo "topics ready"

  # --- Observability stack ---
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.109.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./infra/otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      # 4327 on the host (4317 is taken by another project's collector); services export here.
      # 8889 is reached by Prometheus over the compose network, so it needs no host mapping.
      - "4327:4317"   # OTLP gRPC

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"

  # --- Application services ---
  gateway:
    <<: *dotnet-service
    environment:
      <<: *dotnet-env
      SERVICE: Gateway
      ReverseProxy__Clusters__shortening__Destinations__d1__Address: "http://shortening:8080/"
      ReverseProxy__Clusters__redirect__Destinations__d1__Address: "http://redirect:8080/"
      ReverseProxy__Clusters__analytics__Destinations__d1__Address: "http://analytics:8080/"
    depends_on:
      - shortening
      - redirect
      - analytics

  shortening:
    <<: *dotnet-service
    environment:
      <<: *dotnet-env
      SERVICE: Shortening
      PublicBaseUrl: "http://localhost:8080"
      Kgs__BaseUrl: "http://kgs:8080"
      Tars__Data__Connections__default__ConnectionString: "Host=postgres;Port=5432;Database=urlshortener_shortening;Username=postgres;Password=postgres;Include Error Detail=true"
      Tars__Caching__Redis__ConnectionString: "redis:6379,abortConnect=False"
      Tars__Messaging__Kafka__BootstrapServers: "kafka:29092"
    depends_on:
      postgres: { condition: service_started }
      redis: { condition: service_started }
      kgs: { condition: service_started }
      kafka-init: { condition: service_completed_successfully }

  redirect:
    <<: *dotnet-service
    environment:
      <<: *dotnet-env
      SERVICE: Redirect
      Tars__Data__Connections__default__ConnectionString: "Host=postgres;Port=5432;Database=urlshortener_shortening;Username=postgres;Password=postgres;Include Error Detail=true"
      Tars__Caching__Redis__ConnectionString: "redis:6379,abortConnect=False"
      Tars__Messaging__Kafka__BootstrapServers: "kafka:29092"
    depends_on:
      postgres: { condition: service_started }
      redis: { condition: service_started }
      kafka-init: { condition: service_completed_successfully }

  analytics:
    <<: *dotnet-service
    environment:
      <<: *dotnet-env
      SERVICE: Analytics
      # directConnection=true: fala direto com o nó mongo, sem seguir o host anunciado
      # pelo replica set (que é "localhost", pro modo host). Transações seguem OK num RS de 1 nó.
      Tars__Data__Mongo__Connections__default__ConnectionString: "mongodb://mongo:27017/?replicaSet=rs0&directConnection=true"
      Tars__Data__Mongo__Connections__default__Database: "urlshortener_analytics"
      Tars__Messaging__Kafka__BootstrapServers: "kafka:29092"
    depends_on:
      mongo-init: { condition: service_completed_successfully }
      kafka-init: { condition: service_completed_successfully }

  kgs:
    <<: *dotnet-service
    environment:
      <<: *dotnet-env
      SERVICE: Kgs
      Tars__Data__Connections__default__ConnectionString: "Host=postgres;Port=5432;Database=urlshortener_kgs;Username=postgres;Password=postgres;Include Error Detail=true"
    depends_on:
      postgres: { condition: service_started }

  web:
    build:
      context: ./src/Pottmayer.UrlShortener.Web
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - gateway

volumes:
  pgdata:
  mongodata:
  kafkadata:

# PAT do GitHub Packages pro restore do feed privado no build (Pottmayer.Tars.*).
# Coloque o token em ./github_token.txt (gitignored) — uma linha só.
secrets:
  github_token:
    file: ./github_token.txt
